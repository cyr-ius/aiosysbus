---
name: Upload Python Package

# Kept in the repository (not reusable) because PyPI trusted publishing
# matches this workflow file and the "release" environment.
on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

jobs:
  build:
    uses: cyr-ius/.github/.github/workflows/py-build.yml@v1

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release:
    needs: publish
    permissions:
      contents: write
    uses: cyr-ius/.github/.github/workflows/gh-release.yml@v1
